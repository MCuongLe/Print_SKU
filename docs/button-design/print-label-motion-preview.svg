<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAF8"/>
      <stop offset="1" stop-color="#E8F1ED"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087655"/>
      <stop offset="1" stop-color="#005F41"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#173C30" flood-opacity="0.16"/>
    </filter>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}
      .button-bg{animation:buttonState 4.8s ease-in-out infinite}
      .idle{animation:idleState 4.8s ease-in-out infinite}
      .sending{animation:sendingState 4.8s ease-in-out infinite}
      .success{animation:successState 4.8s ease-in-out infinite}
      .label-a{animation:feedA 4.8s cubic-bezier(.2,.8,.2,1) infinite;transform-box:fill-box;transform-origin:center}
      .label-b{animation:feedB 4.8s cubic-bezier(.2,.8,.2,1) infinite;transform-box:fill-box;transform-origin:center}
      .label-c{animation:feedC 4.8s cubic-bezier(.2,.8,.2,1) infinite;transform-box:fill-box;transform-origin:center}
      .lamp{animation:lamp 4.8s ease-in-out infinite}
      @keyframes idleState{0%,14%,82%,100%{opacity:1}18%,78%{opacity:0}}
      @keyframes sendingState{0%,14%,46%,100%{opacity:0}18%,42%{opacity:1}}
      @keyframes successState{0%,44%,78%,100%{opacity:0}49%,73%{opacity:1}}
      @keyframes buttonState{0%,44%,80%,100%{fill:#005F41;stroke:#005F41}49%,76%{fill:#EAF7F1;stroke:#B9DECF}}
      @keyframes feedA{0%,17%{opacity:0;transform:translateX(-16px) scale(1)}19%{opacity:1}30%{opacity:0;transform:translateX(42px) scale(.7)}100%{opacity:0}}
      @keyframes feedB{0%,21%{opacity:0;transform:translateX(-16px) scale(1)}23%{opacity:1}34%{opacity:0;transform:translateX(42px) scale(.7)}100%{opacity:0}}
      @keyframes feedC{0%,25%{opacity:0;transform:translateX(-16px) scale(1)}27%{opacity:1}38%{opacity:0;transform:translateX(42px) scale(.7)}100%{opacity:0}}
      @keyframes lamp{0%,27%,37%,100%{fill:#80E0B9}31%,34%{fill:#FFFFFF}}
      @media (prefers-reduced-motion:reduce){
        .button-bg,.idle,.sending,.success,.label-a,.label-b,.label-c,.lamp{animation:none}
        .idle{opacity:1}.sending,.success,.label-a,.label-b,.label-c{opacity:0}
      }
    </style>
  </defs>

  <rect width="960" height="400" fill="url(#bg)"/>
  <text x="480" y="70" text-anchor="middle" fill="#17251F" font-size="24" font-weight="760">Prototype chuyển động · Button In tem</text>
  <text x="480" y="99" text-anchor="middle" fill="#60736B" font-size="14">Chu kỳ minh họa: sẵn sàng → gửi lệnh → hàng đợi đã nhận</text>

  <g filter="url(#shadow)">
    <rect class="button-bg" x="160" y="144" width="640" height="104" rx="52" fill="#005F41" stroke="#005F41" stroke-width="2"/>
  </g>

  <g class="idle">
    <g transform="translate(238 169)" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 21V5h34v16M8 42H4a6 6 0 0 1-6-6V24a6 6 0 0 1 6-6h42a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6h-4"/>
      <rect x="11" y="34" width="28" height="22" rx="3"/>
    </g>
    <text x="346" y="207" fill="#FFFFFF" font-size="20" font-weight="760">In 12 tem</text>
    <text x="695" y="207" text-anchor="end" fill="#CFE8DF" font-size="13" font-weight="700">SẴN SÀNG</text>
  </g>

  <g class="sending" opacity="0">
    <g transform="translate(224 169)">
      <g class="label-a">
        <rect x="0" y="14" width="34" height="28" rx="4" fill="#FFFFFF"/>
        <path d="M7 22h20M7 29h14M7 36h18" stroke="#005F41" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g class="label-b">
        <rect x="0" y="14" width="34" height="28" rx="4" fill="#FFFFFF"/>
        <path d="M7 22h20M7 29h14M7 36h18" stroke="#005F41" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g class="label-c">
        <rect x="0" y="14" width="34" height="28" rx="4" fill="#FFFFFF"/>
        <path d="M7 22h20M7 29h14M7 36h18" stroke="#005F41" stroke-width="2" stroke-linecap="round"/>
      </g>
      <rect x="72" y="8" width="46" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M82 14h26v16H82zM87 38h16v18H87z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
      <circle class="lamp" cx="107" cy="34" r="3" fill="#80E0B9"/>
    </g>
    <text x="386" y="207" fill="#FFFFFF" font-size="20" font-weight="760">Đang gửi 12 tem…</text>
    <text x="695" y="207" text-anchor="end" fill="#CFE8DF" font-size="13" font-weight="700">KHÔNG BẤM LẠI</text>
  </g>

  <g class="success" opacity="0">
    <circle cx="252" cy="196" r="27" fill="#16865D"/>
    <path d="M240 196l9 9 17-20" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="300" y="190" fill="#075C40" font-size="20" font-weight="760">Đã gửi 12 tem</text>
    <text x="300" y="215" fill="#4F7868" font-size="13" font-weight="600">Lệnh đã vào hàng đợi</text>
    <text x="695" y="204" text-anchor="end" fill="#16865D" font-size="13" font-weight="700">ĐÃ NHẬN</text>
  </g>

  <rect x="303" y="288" width="354" height="40" rx="20" fill="#FFFFFF" stroke="#D9E2DE"/>
  <circle cx="330" cy="308" r="5" fill="#16865D"/>
  <text x="346" y="313" fill="#60736B" font-size="12" font-weight="650">Demo tự lặp; bản triển khai chỉ chạy sau khi nhấn</text>
  <text x="480" y="370" text-anchor="middle" fill="#7C8E86" font-size="11">Nếu thiết bị bật Reduce Motion, SVG giữ trạng thái tĩnh “In 12 tem”.</text>
</svg>
