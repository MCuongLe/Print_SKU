<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đồng bộ tự động</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#f4f7f6}
body{margin:0;padding:24px 16px 48px;color:#17251f;font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;display:grid;gap:16px}
header{display:flex;align-items:center;gap:12px}
header h1{margin:0;color:#005f41;font-size:22px;font-weight:700;line-height:1.2}
header .ver{margin-left:auto;color:#5b6b64;font-size:13px;font-weight:600}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}
.card{padding:18px 20px;border:1px solid #dce7e3;border-radius:14px;background:#fff}
.card h2{display:flex;align-items:center;gap:8px;margin:0 0 14px;color:#005f41;font-size:16px;font-weight:700}
.fatal{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:14px;background:#fde8e5;color:#a53730;font-size:14px;font-weight:600}
.fatal[hidden]{display:none}
.problems{display:flex;align-items:flex-start;gap:8px;padding:12px 16px;border:1px solid #f1b8b1;border-radius:14px;background:#fff4f2;color:#b42318;font-size:14px;font-weight:600}
.problems[hidden]{display:none}
.problems ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{color:#31483f;font-size:13px;font-weight:600}
input[type=text],input[type=email],input[type=password]{width:100%;min-height:40px;padding:0 12px;border:1px solid #cbdcd6;border-radius:10px;background:#fff;color:#17251f;font:400 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
input:focus-visible,button:focus-visible{outline:2px solid #42a282;outline-offset:2px}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid #cbdcd6;border-radius:999px;background:#fff;color:#176248;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer}
button.primary{border-color:#005f41;background:#005f41;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.err{margin:8px 0 0;color:#b42318;font-size:13px;font-weight:600}
.err[hidden]{display:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row .who{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.sub{color:#5b6b64;font-size:12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.switch .txt{display:grid;gap:2px;font-weight:600}
.switch input{position:absolute;opacity:0;width:44px;height:24px;margin:0}
.track{position:relative;flex:none;width:44px;height:24px;border-radius:999px;background:#c7d3ce;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw{position:relative;display:inline-flex;flex:none}
.sw input:checked+.track{background:#007754}
.sw input:checked+.track::after{transform:translateX(20px)}
.sw input:focus-visible+.track{outline:2px solid #42a282;outline-offset:2px}
.sw input:disabled+.track{opacity:.45}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #edf2f0;border-radius:12px;background:#f9fbfa}
.tile b{display:block;font-size:14px;font-weight:600}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:#9aa8a2}
.dot[data-on=true]{background:#1f9d6b}
.meta{display:flex;align-items:center;gap:8px;margin-top:12px;color:#31483f;font-size:13px;font-weight:600}
.meta.warn{color:#8a5b00}
.meta[hidden]{display:none}
.last{display:grid;gap:12px}
.last-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 14px;border:1px solid #edf2f0;border-radius:12px}
.last-row .head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:600}
.last-row .msg{grid-column:1/-1;color:#31483f;font-size:13px;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 9px;border-radius:999px;background:#eef1f0;color:#4f625b;font-size:12px;font-weight:600;white-space:nowrap}
.chip[data-tone=ok]{background:#e3f5ec;color:#0f6a49}
.chip[data-tone=held]{background:#fff3d6;color:#8a5b00}
.chip[data-tone=error]{background:#fde8e5;color:#a53730}
.runwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:2;display:grid;min-width:150px;padding:6px;border:1px solid #dce7e3;border-radius:12px;background:#fff;box-shadow:0 8px 22px rgba(13,71,52,.14)}
.menu[hidden]{display:none}
.menu button{justify-content:flex-start;border:0;border-radius:8px;min-height:36px}
.menu button:hover{background:#f3f8f6}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:6px 8px;border-bottom:1px solid #dce7e3;color:#5b6b64;font-size:12px;font-weight:600;text-align:left;white-space:nowrap}
td{padding:8px;border-bottom:1px solid #edf2f0;vertical-align:top}
td.time,td:nth-child(2),td:nth-child(3){white-space:nowrap}
td.msgc{min-width:140px;overflow-wrap:anywhere}
.empty{padding:12px 8px;color:#5b6b64}
</style>
</head>
<body>
<main>
  <header><svg class="ico" data-ico="refresh" viewBox="0 0 24 24" aria-hidden="true" style="color:#005f41"></svg><h1>Đồng bộ tự động</h1><span class="ver" id="ver"></span></header>
  <div class="fatal" id="fatal" role="alert" hidden><svg class="ico" data-ico="alert" viewBox="0 0 24 24" aria-hidden="true"></svg><span>Không gọi được service worker, Reload Extension</span></div>
  <div class="problems" id="problems" role="status" hidden><svg class="ico" data-ico="alert" viewBox="0 0 24 24" aria-hidden="true"></svg><ul id="problems-list"></ul></div>

  <section class="card" aria-labelledby="h-session">
    <h2 id="h-session"><svg class="ico" data-ico="user" viewBox="0 0 24 24" aria-hidden="true"></svg>Phiên Admin</h2>
    <form id="signin" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div>
      <div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password"></div>
      <button class="primary" id="signin-btn" type="submit"><svg class="ico sm" data-ico="login" viewBox="0 0 24 24" aria-hidden="true"></svg>Đăng nhập</button>
      <p class="err" id="signin-err" role="alert" hidden></p>
    </form>
    <div class="row" id="signed" hidden>
      <span class="who"><svg class="ico sm" data-ico="user" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="who-email"></span></span>
      <button id="signout-btn" type="button"><svg class="ico sm" data-ico="logout" viewBox="0 0 24 24" aria-hidden="true"></svg>Đăng xuất</button>
    </div>
  </section>

  <section class="card" aria-labelledby="h-device">
    <h2 id="h-device"><svg class="ico" data-ico="monitor" viewBox="0 0 24 24" aria-hidden="true"></svg>Máy này</h2>
    <div class="field"><label for="device">Tên máy</label><input id="device" type="text" maxlength="40" autocomplete="off"></div>
    <p class="err" id="device-err" role="alert" hidden></p>
    <div class="switch">
      <span class="txt"><span id="enabled-label">Bật trên máy này</span><span class="sub" id="enabled-sub" hidden>Nhập tên máy</span></span>
      <label class="sw"><input id="enabled" type="checkbox" role="switch" aria-labelledby="enabled-label"><span class="track" aria-hidden="true"></span></label>
    </div>
  </section>

  <section class="card" aria-labelledby="h-state">
    <h2 id="h-state"><svg class="ico" data-ico="activity" viewBox="0 0 24 24" aria-hidden="true"></svg>Trạng thái</h2>
    <div class="tiles">
      <div class="tile"><i class="dot" id="dot-wms" data-on="false"></i><div><b>WMS</b><span class="sub" id="txt-wms">Không có tab</span></div></div>
      <div class="tile"><i class="dot" id="dot-inside" data-on="false"></i><div><b>Inside</b><span class="sub" id="txt-inside">Không có tab</span></div></div>
    </div>
    <div class="meta" id="next"><svg class="ico sm" data-ico="clock" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="next-text">Lượt kế: —</span></div>
    <div class="meta warn" id="paused" hidden><svg class="ico sm" data-ico="pause" viewBox="0 0 24 24" aria-hidden="true"></svg><span>Admin tạm dừng</span></div>
  </section>

  <section class="card" aria-labelledby="h-last">
    <h2 id="h-last"><svg class="ico" data-ico="history" viewBox="0 0 24 24" aria-hidden="true"></svg>Lượt gần nhất</h2>
    <div class="last" id="last"></div>
    <p class="err" id="run-err" role="alert" hidden></p>
  </section>

  <section class="card" aria-labelledby="h-log">
    <h2 id="h-log"><svg class="ico" data-ico="list" viewBox="0 0 24 24" aria-hidden="true"></svg>Nhật ký</h2>
    <div class="tablewrap"><table><thead><tr><th>Giờ</th><th>Loại</th><th>Chế độ</th><th>Trạng thái</th><th>Thông điệp</th></tr></thead><tbody id="log"></tbody></table></div>
  </section>
</main>
<script src="options.js"></script>
</body>
</html>
